{% extends "admin/change_list.html" %}
{% load i18n admin_urls static admin_list %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Custom styles for ConstValue change list */
    .results th, .results td {
        text-align: right;
        direction: rtl;
    }
    
    .results th {
        background: #f8f8f8;
        font-weight: bold;
        border-bottom: 2px solid #ddd;
    }
    
    .results tr:hover {
        background: #f5f5f5;
    }
    
    /* Parent column styling */
    .parent-item {
        color: #666;
        font-style: italic;
    }
    
    .child-item {
        color: #333;
        margin-right: 20px;
    }
    
    /* Status column styling */
    .status-active { color: #4CAF50; font-weight: bold; }
    .status-inactive { color: #F44336; }
    
    /* Filter improvements */
    #changelist-filter h3 {
        color: #333;
        font-size: 13px;
        margin: 10px 0 5px 0;
    }
    
    #changelist-filter ul {
        list-style: none;
        padding: 0;
        margin: 0 0 15px 0;
    }
    
    #changelist-filter li {
        margin: 2px 0;
    }
    
    #changelist-filter a {
        color: #417690;
        text-decoration: none;
        padding: 3px 8px;
        display: block;
        border-radius: 2px;
        transition: background 0.3s;
    }
    
    #changelist-filter a:hover, #changelist-filter a.selected {
        background: #417690;
        color: white;
    }
    
    /* Search bar */
    #searchbar {
        background: #f8f8f8;
        border: 1px solid #ddd;
        border-radius: 3px;
        padding: 10px;
        margin: 10px 0;
        direction: rtl;
    }
    
    #searchbar input[type=text] {
        width: 200px;
        padding: 5px;
        border: 1px solid #ddd;
        border-radius: 3px;
        margin-left: 10px;
    }
    
    #searchbar button {
        background: #417690;
        color: white;
        border: none;
        padding: 5px 15px;
        border-radius: 3px;
        cursor: pointer;
    }
    
    #searchbar button:hover {
        background: #205067;
    }
    
    /* Hierarchy display */
    .hierarchy-indent {
        margin-right: 20px;
    }
    
    .hierarchy-parent {
        font-weight: bold;
        color: #333;
    }
    
    .hierarchy-child {
        color: #666;
        font-style: italic;
    }
</style>
{% endblock %}

{% block content %}
{{ block.super }}
{% endblock %}
